<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《泊》TIDE TERMINAL V25.0 - 機構級真實資產與成分解析終端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        .tab-active { background: #2563eb !important; color: #ffffff !important; border-color: #3b82f6 !important; }
        .modal-backdrop { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(6px); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center selection:bg-blue-600 selection:text-white">

    <!-- 頂部終端導覽 -->
    <header class="w-full max-w-7xl mb-5 bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
        <div class="flex items-center gap-3">
            <span class="text-xs font-mono font-bold bg-blue-600 text-white px-2.5 py-1 rounded">TIDE V25.0</span>
            <h1 class="text-sm md:text-base font-bold tracking-tight text-white">專業機構級真實資產與持倉解析終端</h1>
        </div>
        <div class="flex items-center gap-2 text-xs bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 font-mono text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>核心持倉・如實揭露</span>
        </div>
    </header>

    <!-- 主版面 -->
    <main class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-5 mb-5">
        
        <!-- 左側：標的總覽與篩選 (7 cols) -->
        <div class="lg:col-span-7 bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col justify-between space-y-3">
            <div>
                <!-- 分類頁籤 -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-3 gap-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">資產與區域分類</span>
                    <div class="flex flex-wrap gap-1 text-xs">
                        <button onclick="filterCategory('all', this)" class="cat-btn tab-active px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold transition">全部</button>
                        <button onclick="filterCategory('global', this)" class="cat-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 transition">全球科技</button>
                        <button onclick="filterCategory('tw', this)" class="cat-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 transition">台股大盤</button>
                        <button onclick="filterCategory('div', this)" class="cat-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 transition">高息現金流</button>
                        <button onclick="filterCategory('defend', this)" class="cat-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 transition">全球債券</button>
                    </div>
                </div>

                <!-- 標的清單 -->
                <div id="expertCardContainer" class="grid grid-cols-1 gap-2.5 mt-3 max-h-[540px] overflow-y-auto pr-1">
                    <!-- 動態渲染 -->
                </div>
            </div>
        </div>

        <!-- 右側：風險報酬矩陣與選定摘要 (5 cols) -->
        <div class="lg:col-span-5 bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-col justify-between space-y-3">
            <div>
                <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                    <span class="text-xs font-bold text-slate-400">風險與報酬分佈矩陣</span>
                    <span class="text-[10px] text-slate-500 mono">Risk vs Return</span>
                </div>

                <div class="relative w-full h-[210px] my-2">
                    <canvas id="tideBubbleChart"></canvas>
                </div>

                <div class="space-y-2 text-xs bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <div id="selected-board-tag" class="font-bold text-slate-200 flex justify-between">
                        <span>選定：00770 國泰北美科技</span>
                        <span class="text-blue-400 mono">Active</span>
                    </div>
                    <div id="drilldown-summary" class="text-slate-400 text-[11px] leading-relaxed border-t border-slate-800 pt-2">
                        年化報酬：18.2% | 夏普比率：1.92 | 聚焦北美軟體與雲端運算龍頭
                    </div>
                    <button onclick="copyTickerToSim()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-1.5 rounded font-bold text-xs transition mt-1">
                        載入至複利模擬器
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- 下方：複利模擬器 -->
    <section class="w-full max-w-7xl bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
            <span class="text-xs font-bold text-slate-300">複利與實質購買力模擬器</span>
            <span id="activeSimBadge" class="text-[11px] font-mono text-blue-400 bg-blue-950 px-2 py-0.5 rounded border border-blue-900">00770</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-center">
            <div class="space-y-2.5 lg:col-span-5">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">標的代號</label>
                        <input type="text" id="simTicker" value="00770" oninput="onTickerInputChange()" class="w-full bg-slate-950 text-blue-400 text-xs px-2.5 py-1.5 rounded border border-slate-800 font-mono font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">每月投入 (萬)</label>
                        <input type="number" id="simMonthly" value="3" oninput="runCustomSimulation()" class="w-full bg-slate-950 text-slate-200 text-xs px-2.5 py-1.5 rounded border border-slate-800 font-mono font-bold focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">年期 (年)</label>
                        <input type="number" id="simYears" value="10" oninput="runCustomSimulation()" class="w-full bg-slate-950 text-slate-200 text-xs px-2.5 py-1.5 rounded border border-slate-800 font-mono font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">年化報酬 (%)</label>
                        <input type="number" step="0.1" id="simRate" value="18.2" oninput="runCustomSimulation()" class="w-full bg-slate-950 text-emerald-400 text-xs px-2.5 py-1.5 rounded border border-slate-800 font-mono font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-1">通膨率 (%)</label>
                        <input type="number" step="0.1" id="simInflation" value="2.0" oninput="runCustomSimulation()" class="w-full bg-slate-950 text-rose-400 text-xs px-2.5 py-1.5 rounded border border-slate-800 font-mono font-bold focus:outline-none">
                    </div>
                </div>
                <div id="customSimResult" class="bg-slate-950 p-2.5 rounded border border-slate-800 text-xs space-y-1 font-mono">
                    <!-- 動態計算 -->
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="text-[11px] text-slate-400 font-semibold mb-1">名目總值 vs 實質購買力趨勢</div>
                <div class="relative w-full h-[180px]">
                    <canvas id="compoundMiniChart"></canvas>
                </div>
            </div>
        </div>
    </section>

    <!-- 獨立成分股透視與細項分析視窗 (Modal) -->
    <div id="holdingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="bg-slate-900 w-full max-w-2xl p-5 rounded-xl border border-slate-700 shadow-xl space-y-3 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <div>
                    <h3 id="modalTitle" class="text-sm font-bold text-white">核心持倉與細項分析</h3>
                    <p id="modalSubtitle" class="text-[11px] text-blue-400 mono mt-0.5">Holdings & Detailed Factor Analysis</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-800 text-xs font-semibold">✕ 關閉</button>
            </div>
            
            <div class="overflow-y-auto pr-1 flex-1 space-y-3" id="modalHoldingsList">
                <!-- 動態注入成分股與細項分析 -->
            </div>

            <div class="border-t border-slate-800 pt-3 text-[11px] text-slate-400 flex justify-between items-center">
                <span id="modalFooterNote">如實呈現官方公開之核心持倉與細項解析</span>
                <button onclick="closeModal()" class="bg-blue-600 text-white px-3.5 py-1.5 rounded text-xs font-semibold">確定</button>
            </div>
        </div>
    </div>

    <!-- 核心運算邏輯 -->

        const ctx = document.getElementById('tideBubbleChart').getContext('2d');
        const miniCtx = document.getElementById('compoundMiniChart').getContext('2d');
        let activeSelectedItem = fullMatrixDb[0];

        const tideBubbleChart = new Chart(ctx, {
            type: 'bubble',
            data: {
                datasets: [{
                    label: 'ETF 矩陣',
                    data: fullMatrixDb,
                    backgroundColor: 'rgba(37, 99, 235, 0.7)',
                    borderColor: '#3b82f6',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: '年化報酬率 (%)', color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#64748b' } },
                    y: { title: { display: true, text: '夏普比率', color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#64748b' } }

                    legend: { display: false },
                    datalabels: { align: 'top', formatter: (val) => val.name.split(' ')[0], color: '#cbd5e1', font: { size: 9, weight: '600' } }
                },
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const item = tideBubbleChart.data.datasets[0].data[elements[0].index];
                        selectItem(item);
                    }
                }

        });

            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '名目資產總值', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3 },

                responsive: true,
                maintainAspectRatio: false,

            const container = document.getElementById('expertCardContainer');
            const filtered = filterCat === 'all' ? fullMatrixDb : fullMatrixDb.filter(i => i.category === filterCat);

                    <div class="flex justify-between items-center gap-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-xs text-white">${item.name}</span>
                            <span class="text-[10px] bg-slate-900 text-slate-400 px-1.5 py-0.5 rounded border border-slate-800">${item.categoryName}</span>
                        </div>
                        <div class="flex items-center gap-1 text-xs font-mono">
                            <span class="text-blue-400 font-bold">+${item.returnRate}%</span>
                            <span class="text-slate-500">| ${item.payout}</span>
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-normal">${item.desc}</p>
                    
                    <div class="flex justify-between items-center pt-2 border-t border-slate-800/80 text-xs">
                        <span class="text-slate-400 text-[11px]">殖利率: <strong class="text-slate-200 mono">${item.yieldStr}</strong> | 夏普: <strong class="text-blue-400 mono">${item.y}</strong></span>
                        <div class="flex gap-1.5">
                            <button onclick="openModal('${item.ticker}')" class="bg-slate-900 hover:bg-slate-800 text-blue-400 px-2 py-1 rounded border border-slate-700 text-[11px] font-semibold transition">
                                🔍 持倉與分析
                            </button>
                            <button onclick="selectTicker('${item.ticker}')" class="bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded text-[11px] font-semibold transition">
                                選取
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(catKey, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 transition";
            });
            btnElement.className = "cat-btn tab-active px-2.5 py-1 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold transition";

            renderExpertCards(catKey);

            let filtered = catKey === 'all' ? fullMatrixDb : fullMatrixDb.filter(i => i.category === catKey);
            tideBubbleChart.data.datasets[0].data = filtered;
            tideBubbleChart.update();
        }

        function selectItem(item) {
            activeSelectedItem = item;
            document.getElementById('selected-board-tag').innerHTML = `<span>選定：${item.name}</span><span class="text-blue-400 mono">Active</span>`;
            document.getElementById('drilldown-summary').innerText = `年化報酬：${item.returnRate}% | 夏普比率：${item.y} | ${item.desc}`;
            renderExpertCards(document.querySelector('.cat-btn.tab-active')?.innerText.includes('全部') ? 'all' : item.category);
        }

        function selectTicker(ticker) {
            const found = fullMatrixDb.find(i => i.ticker === ticker);
            if (found) selectItem(found);
        }

        function openModal(ticker) {
            const found = fullMatrixDb.find(i => i.ticker === ticker);
            if (!found) return;

            document.getElementById('modalTitle').innerText = `${found.name} - 核心持倉與細項分析`;
            document.getElementById('modalSubtitle').innerText = `揭露 ${found.holdings.length} 項官方核心持倉與驅動因子深度解析`;
            document.getElementById('modalFooterNote').innerText = found.totalNote;

            const listContainer = document.getElementById('modalHoldingsList');
            listContainer.innerHTML = found.holdings.map((h, idx) => `
                <div class="bg-slate-950 p-3 rounded border border-slate-800 space-y-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-200">${idx + 1}. ${h.name}</span>
                        <span class="text-blue-400 mono font-bold">${h.weight}</span>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-relaxed border-t border-slate-900 pt-1">
                        <strong class="text-slate-300">分析：</strong>${h.analysis}
                    </p>
                </div>
            `).join('');

            document.getElementById('holdingsModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('holdingsModal').classList.add('hidden');
        }

        function copyTickerToSim() {
            if (!activeSelectedItem) return;
            document.getElementById('simTicker').value = activeSelectedItem.ticker;
            document.getElementById('simRate').value = activeSelectedItem.returnRate;
            document.getElementById('activeSimBadge').innerText = activeSelectedItem.ticker;
            runCustomSimulation();
        }

        function onTickerInputChange() {
            const inputVal = document.getElementById('simTicker').value.trim().toUpperCase();
            document.getElementById('activeSimBadge').innerText = inputVal || 'CUSTOM';
            const found = fullMatrixDb.find(e => e.ticker === inputVal);
            if (found) {
                document.getElementById('simRate').value = found.returnRate;
                selectItem(found);
            }
            runCustomSimulation();
        }

        function runCustomSimulation() {
            const ticker = document.getElementById('simTicker').value.trim().toUpperCase() || 'CUSTOM';
            const monthly = parseFloat(document.getElementById('simMonthly').value) || 3;
            const years = parseInt(document.getElementById('simYears').value) || 10;
            const annualRatePct = parseFloat(document.getElementById('simRate').value) || 10.0;
            const inflationRate = parseFloat(document.getElementById('simInflation').value) || 2.0;

            const months = years * 12;
            const monthlyRate = (annualRatePct / 100) / 12;

            let totalInvested = monthly * months;
            let futureValue = 0;

            let labels = [];
            let investedData = [];
            let valueData = [];
            let realData = [];

            for (let i = 0; i <= months; i++) {
                if (i === 0) {
                    labels.push('0Y'); investedData.push(0); valueData.push(0); realData.push(0);
                } else {
                    futureValue = (futureValue + monthly) * (1 + monthlyRate);
                    let currentReal = futureValue / Math.pow(1 + (inflationRate / 100), i / 12);
                    if (i % 12 === 0 || i === months) {
                        labels.push(`${(i/12).toFixed(0)}Y`);
                        investedData.push(monthly * i);
                        valueData.push(parseFloat(futureValue.toFixed(1)));
                        realData.push(parseFloat(currentReal.toFixed(1)));
                    }
                }
            }

            document.getElementById('customSimResult').innerHTML = `
                <div class="text-blue-400 font-bold mb-0.5">標的：${ticker} (${annualRatePct}%)</div>
                <div class="text-slate-400 flex justify-between"><span>投入本金：</span><span class="text-white">${totalInvested.toFixed(1)} 萬</span></div>
                <div class="text-slate-400 flex justify-between"><span>資產終值：</span><span class="text-blue-400">${futureValue.toFixed(1)} 萬</span></div>
                <div class="text-rose-400 flex justify-between border-t border-slate-800 pt-1 mt-1"><span>實質購買力：</span><span class="text-rose-400">${realData[realData.length-1]} 萬</span></div>
            `;

            compoundMiniChart.data.labels = labels;
            compoundMiniChart.data.datasets[0].data = valueData;
            compoundMiniChart.data.datasets[1].data = realData;
            compoundMiniChart.data.datasets[2].data = investedData;
            compoundMiniChart.update();
        }

        renderExpertCards('all');
        runCustomSimulation();
    </script>
</body>
</html>
