<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易潮汐預報 App (Tide App Clone)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold">🌊 台灣潮汐預報</h1>
            <p id="station-name" class="text-sm text-slate-400">觀測站：高雄港 (Kaohsiung Port)</p>
        </div>
        <button onclick="changeStation()" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-700 transition">
            切換地點
        </button>
    </header>

    <main class="w-full max-w-md space-y-4">
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-lg text-center">
            <span id="tide-trend" class="text-xs uppercase tracking-wider bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-full font-semibold">水位上漲中</span>
            <div class="my-3">
                <span id="current-water-level" class="text-5xl font-extrabold">1.42</span>
                <span class="text-xl text-slate-400">公尺</span>
            </div>
            <p id="next-tide-info" class="text-sm text-slate-300">預計 14:30 達到滿潮 (約 2.1公尺)</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl shadow-lg">
            <h2 class="text-sm font-semibold text-slate-400 mb-2">24 小時潮汐趨勢圖</h2>
            <div class="relative w-full h-48">
                <canvas id="tideChart" class="w-full h-full"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex items-center space-x-3">
                <span class="text-2xl">🌅</span>
                <div>
                    <div class="text-xs text-slate-400">日出 / 日落</div>
                    <div class="text-sm font-bold">05:42 / 18:31</div>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex items-center space-x-3">
                <span class="text-2xl">🌕</span>
                <div>
                    <div class="text-xs text-slate-400">月相</div>
                    <div class="text-sm font-bold">上弦月</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('tideChart');
        const ctx = canvas.getContext('2d');

        // 初始化 Canvas 解析度
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            drawTideCurve();
        }

        // 繪製潮汐曲線
        function drawTideCurve() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const width = canvas.width;
            const height = canvas.height;

            // 模擬 24 小時的潮汐數據點 (0 ~ 24 小時對應的水位高度)
            // 這裡用正弦波數學模型模擬潮汐起伏
            const points = [];
            for (let i = 0; i <= 24; i += 1) {
                // 潮汐一天通常有兩次漲退潮 (M2 分潮模型簡化版)
                const level = 1.2 + 1.0 * Math.sin((i - 3) * Math.PI / 6);
                points.push({ x: (i / 24) * width, y: height - (level / 2.5) * height });
            }

            // 繪製背景網格線
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, (height / 4) * i);
                ctx.lineTo(width, (height / 4) * i);
                ctx.stroke();
            }

            // 繪製平滑曲線 (貝茲曲線)
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i + 1].x) / 2;
                const yc = (points[i].y + points[i + 1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.strokeStyle = '#38bdf8'; // Sky blue
            ctx.lineWidth = 3;
            ctx.stroke();

            // 填充曲線下方漸層色彩
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
            ctx.fill();
        }

        // 切換地點範例動作
        function changeStation() {
            const stations = ["高雄港", "基隆港", "台中港", "花蓮港"];
            const current = document.getElementById('station-name').innerText;
            let next = stations[(stations.indexOf(current.replace('觀測站： ', '').split(' ')[0]) + 1) % stations.length];
            document.getElementById('station-name').innerText = `觀測站： ${next} Port`;
            drawTideCurve();
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = resizeCanvas;
    </script>
</body>
</html>
