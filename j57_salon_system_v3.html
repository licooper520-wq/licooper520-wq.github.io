<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.57Beauty Skin - 雙系統美學管理 v4.0 完整修復版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#FAF6f0',    
                            card: '#ffffff',
                            primary: '#B68D6A',  
                            secondary: '#D4B89F',
                            text: '#4A3B32',    
                            border: '#E8DCCB'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'PMingLiU', 'serif'],
                        sans: ['"PingFang TC"', '"Microsoft JhengHei"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
        canvas { touch-action: none; cursor: crosshair; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .input-line {
            border: none; border-bottom: 1px solid #71717a; background: transparent;
            border-radius: 0; padding: 0 4px; outline: none; color: #4A3B32;
        }
        .input-line:focus { border-bottom: 2px solid #B68D6A; }
        
        /* 強制確保所有表單選項與標籤皆可正常點擊 */
        input[type="checkbox"], input[type="radio"], label, button {
            cursor: pointer !important;
            pointer-events: auto !important;
        }
        input[type="checkbox"], input[type="radio"] {
            accent-color: #B68D6A; width: 1.1rem; height: 1.1rem;
        }
        .sub-checkbox {
            accent-color: #B68D6A; width: 0.95rem; height: 0.95rem; cursor: pointer !important;
        }
        .export-hidden { display: flex; }
        body.exporting .export-hidden { display: none !important; }
        body.exporting .paper-container { box-shadow: none; border: none; border-radius: 0; margin: 0; padding: 2rem; max-width: none; }
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #B68D6A;
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #main-content { font-size: var(--app-font-size, 1rem); }
        
        #globalLoader.hidden,
        #dbModal.hidden,
        #signatureModal.hidden {
            display: none !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="bg-brand-bg text-brand-text relative">

    <!-- 系統導覽列 -->
    <header class="bg-brand-text text-white shadow-md px-3 md:px-6 py-3 flex justify-between items-center z-30 sticky top-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand-primary rounded flex items-center justify-center font-bold text-lg text-white shadow-inner">
                J
            </div>
            <div class="hidden md:block">
                <h1 class="font-bold text-lg tracking-wider">J.57 雙系統美學管理</h1>
                <p class="text-xs text-brand-secondary" id="currentCustomerNameDisplay">正在建立新表單...</p>
            </div>
        </div>
        
        <div class="flex items-center gap-1.5 md:gap-2">
            <div class="flex items-center bg-gray-700 rounded px-1.5 py-1 text-xs md:text-sm mr-1">
                <span class="text-gray-300 mr-1 hidden sm:inline"><i class="fas fa-text-height"></i></span>
                <button type="button" onclick="window.adjustFontSize(-1)" class="px-2 py-0.5 hover:bg-gray-600 rounded font-bold transition cursor-pointer" title="縮小字體">A-</button>
                <span id="fontSizeIndicator" class="px-1 text-brand-secondary font-medium">100%</span>
                <button type="button" onclick="window.adjustFontSize(1)" class="px-2 py-0.5 hover:bg-gray-600 rounded font-bold transition cursor-pointer" title="放大字體">A+</button>
            </div>

            <input type="file" id="backupFileInput" class="hidden" accept=".json" onchange="window.handleFileSelect(event)">

            <button type="button" onclick="window.createNewCustomer()" class="px-3 py-2 bg-gray-600 hover:bg-gray-500 rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 cursor-pointer" title="開新表單">
                <i class="fas fa-plus"></i> <span class="hidden sm:inline">新表單</span>
            </button>
            <button type="button" onclick="window.openCustomerListModal()" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 border border-gray-500 cursor-pointer" title="開啟雲端資料庫">
                <i class="fas fa-database"></i> <span class="hidden sm:inline">資料庫</span>
            </button>
            
            <div class="relative group">
                <button type="button" class="px-3 py-2 bg-brand-secondary hover:bg-brand-primary text-white rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fas fa-shield-alt"></i> <span class="hidden sm:inline">智慧備份</span> <i class="fas fa-caret-down text-xs"></i>
                </button>
                <div class="absolute right-0 mt-1 w-52 bg-white rounded-lg shadow-xl py-2 hidden group-hover:block z-40 text-gray-800 border border-gray-200">
                    <button type="button" onclick="window.exportDatabaseBackup()" class="w-full text-left px-4 py-2.5 hover:bg-brand-bg text-xs md:text-sm flex items-center gap-2 cursor-pointer">
                        <i class="fas fa-file-download text-brand-primary"></i> 匯出本機備份檔 (.json)
                    </button>
                    <button type="button" onclick="window.triggerRestoreBackup()" class="w-full text-left px-4 py-2.5 hover:bg-brand-bg text-xs md:text-sm flex items-center gap-2 cursor-pointer">
                        <i class="fas fa-file-upload text-blue-600"></i> 從檔案還原資料
                    </button>
                </div>
            </div>

            <button type="button" onclick="window.saveToDB()" class="px-3.5 py-2 bg-brand-primary hover:bg-brand-secondary text-white rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 shadow-lg cursor-pointer">
                <i class="fas fa-cloud-upload-alt"></i> <span class="hidden sm:inline">雲端儲存</span>
            </button>
            <button type="button" onclick="window.exportToImage()" class="px-3 py-2 bg-blue-600 hover:bg-blue-500 rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 cursor-pointer">
                <i class="fas fa-image"></i> <span class="hidden lg:inline">匯出圖片</span>
            </button>
        </div>
    </header>

    <!-- 分頁切換標籤 (四大分頁) -->
    <div class="bg-white border-b border-gray-200 flex justify-center flex-wrap gap-2 sm:gap-6 shrink-0 px-2 pt-2 sticky top-[57px] z-20 shadow-sm">
        <button type="button" onclick="window.switchTab('tab-skin-intake')" id="btn-tab-skin-intake" class="py-2.5 px-3 font-bold text-brand-primary border-b-4 border-brand-primary transition text-sm sm:text-base cursor-pointer">
            肌膚管理資料表
        </button>
        <button type="button" onclick="window.switchTab('tab-skin-log')" id="btn-tab-skin-log" class="py-2.5 px-3 font-bold text-gray-400 border-b-4 border-transparent hover:text-brand-primary transition text-sm sm:text-base cursor-pointer">
            肌膚服務紀錄
        </button>
        <button type="button" onclick="window.switchTab('tab-scalp-intake')" id="btn-tab-scalp-intake" class="py-2.5 px-3 font-bold text-gray-400 border-b-4 border-transparent hover:text-brand-primary transition text-sm sm:text-base cursor-pointer">
            頭皮養護顧客資料卡
        </button>
        <button type="button" onclick="window.switchTab('tab-scalp-log')" id="btn-tab-scalp-log" class="py-2.5 px-3 font-bold text-gray-400 border-b-4 border-transparent hover:text-brand-primary transition text-sm sm:text-base cursor-pointer">
            頭皮服務紀錄
        </button>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-1 p-4 md:p-8 bg-brand-bg relative min-h-[80vh]" id="main-content">
        
        <div id="globalLoader" class="absolute inset-0 bg-brand-bg bg-opacity-85 z-50 hidden flex-col items-center justify-center">
            <div class="loader mb-3"></div>
            <p class="font-bold text-brand-text tracking-widest text-sm" id="loaderText">系統同步中...</p>
        </div>

        <!-- ==================== 分頁 1: 肌膚管理顧客資料表 ==================== -->
        <div id="tab-skin-intake" class="paper-container max-w-4xl mx-auto bg-white p-6 md:p-12 rounded-xl shadow-lg border border-brand-border">
            <div class="text-center mb-8 relative">
                <p class="text-sm tracking-[0.3em] text-gray-500 mb-1">J.57 BEAUTY SKIN</p>
                <h2 class="text-2xl md:text-3xl font-serif font-bold text-brand-text tracking-widest mb-1">肌膚管理顧客資料表</h2>
                <p class="text-xs tracking-[0.2em] text-gray-400 uppercase">Skin Management Client Profile</p>
            </div>

            <form id="skinIntakeForm" class="space-y-6">
                <!-- 基本資料 -->
                <div class="border border-brand-border rounded-xl p-4 md:p-6 relative mt-10">
                    <div class="absolute -top-4 left-6 bg-brand-secondary text-white px-4 py-1 rounded-full text-sm font-bold tracking-wider">基本資料</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-y-4 gap-x-6 mt-2">
                        <div class="flex items-center"><label class="whitespace-nowrap mr-2 font-bold">姓名：</label><input type="text" id="skinCustName" class="input-line flex-1" oninput="window.syncData('skin')"></div>
                        <div class="flex items-center"><label class="whitespace-nowrap mr-2 font-bold">生日：</label><input type="date" id="skinCustBirthday" class="input-line flex-1 text-sm" oninput="window.syncData('skin')"></div>
                        <div class="flex items-center"><label class="whitespace-nowrap mr-2 font-bold">電話：</label><input type="tel" id="skinCustPhone" class="input-line flex-1" oninput="window.syncData('skin')"></div>
                        <div class="flex items-center lg:col-span-1"><label class="whitespace-nowrap mr-2 font-bold">LINE ID：</label><input type="text" id="skinCustLine" class="input-line flex-1" oninput="window.syncData('skin')"></div>
                        <div class="flex items-center lg:col-span-2"><label class="whitespace-nowrap mr-2 font-bold">地址：</label><input type="text" id="skinCustAddress" class="input-line flex-1" oninput="window.syncData('skin')"></div>
                        
                        <div class="col-span-full flex flex-wrap items-center gap-3 mt-2 text-sm md:text-base">
                            <label class="whitespace-nowrap font-bold">如何得知本店：</label>
                            <label><input type="checkbox" name="skinHowKnow" value="IG"> IG</label>
                            <label><input type="checkbox" name="skinHowKnow" value="FB"> FB</label>
                            <label><input type="checkbox" name="skinHowKnow" value="Google"> Google</label>
                            <div class="flex items-center"><label><input type="checkbox" name="skinHowKnow" value="親友介紹"> 親友介紹，介紹人</label><input type="text" id="skinReferralName" class="input-line w-20 ml-1"></div>
                            <div class="flex items-center"><label><input type="checkbox" name="skinHowKnow" value="其他"> 其他</label><input type="text" id="skinOtherKnowText" class="input-line w-20 ml-1"></div>
                        </div>

                        <div class="col-span-full flex flex-wrap items-center gap-4 mt-1 text-sm md:text-base">
                            <label class="whitespace-nowrap font-bold">希望的美容環境：</label>
                            <label><input type="radio" name="prefEnv" value="安靜"> 安靜</label>
                            <label><input type="radio" name="prefEnv" value="喜歡聊天"> 喜歡聊天</label>
                            <label><input type="radio" name="prefEnv" value="依狀況而定"> 依狀況而定</label>
                        </div>
                    </div>
                </div>

                <!-- 基本狀況 -->
                <div class="border border-brand-border rounded-xl p-4 md:p-6 relative mt-10">
                    <div class="absolute -top-4 left-6 bg-brand-secondary text-white px-4 py-1 rounded-full text-sm font-bold tracking-wider">基本狀況</div>
                    <div class="space-y-3 mt-2 text-sm md:text-base leading-relaxed">
                        <div class="flex items-center gap-4"><span class="font-bold">● 是否有化妝習慣：</span><label><input type="radio" name="makeupHabit" value="是"> 是</label><label><input type="radio" name="makeupHabit" value="否"> 否</label></div>
                        <div class="flex items-center gap-4"><span class="font-bold">● 是否有去角質習慣：</span><label><input type="radio" name="exfoliateHabit" value="是"> 是</label><label><input type="radio" name="exfoliateHabit" value="否"> 否</label></div>
                        <div class="flex flex-wrap items-center gap-2"><span class="font-bold">● 是否做過手術/醫美：</span><label><input type="radio" name="medicalHistory" value="是"> 是</label><input type="text" id="medicalDetail" class="input-line w-24 md:w-48"><label class="ml-2"><input type="radio" name="medicalHistory" value="否"> 否</label></div>
                        <div class="flex items-center gap-4"><span class="font-bold">● 皮膚過敏/病史：</span><label><input type="radio" name="allergyHistory" value="是"> 是</label><label><input type="radio" name="allergyHistory" value="否"> 否</label></div>

                        <div class="flex flex-wrap items-center gap-3"><span class="font-bold">● 洗臉/卸妝產品：</span>
                            <label><input type="checkbox" name="cleanser" value="無使用"> 無使用</label><label><input type="checkbox" name="cleanser" value="洗面乳"> 洗面乳</label>
                            <label><input type="checkbox" name="cleanser" value="洗面皂"> 洗面皂</label><label><input type="checkbox" name="cleanser" value="卸妝兩用洗面乳"> 卸妝兩用洗面乳</label>
                            <label><input type="checkbox" name="cleanser" value="卸妝水"> 卸妝水</label><label><input type="checkbox" name="cleanser" value="卸妝凝露"> 卸妝凝露</label>
                            <label><input type="checkbox" name="cleanser" value="卸妝乳"> 卸妝乳</label><label><input type="checkbox" name="cleanser" value="卸妝油"> 卸妝油</label><label><input type="checkbox" name="cleanser" value="其他"> 其他</label>
                        </div>

                        <div class="flex flex-wrap items-center gap-3"><span class="font-bold">● 目前保養品：</span>
                            <label><input type="checkbox" name="skincare" value="化妝水"> 化妝水</label><label><input type="checkbox" name="skincare" value="精華液"> 精華液</label>
                            <label><input type="checkbox" name="skincare" value="乳液"> 乳液</label><label><input type="checkbox" name="skincare" value="面膜"> 面膜</label>
                            <label><input type="checkbox" name="skincare" value="乳霜"> 乳霜</label><label><input type="checkbox" name="skincare" value="其他"> 其他</label>
                        </div>

                        <div class="flex flex-wrap items-center gap-3"><span class="font-bold">● 肌膚類型：</span>
                            <label><input type="radio" name="skinType" value="中性"> 中性</label><label><input type="radio" name="skinType" value="油性"> 油性</label>
                            <label><input type="radio" name="skinType" value="乾性"> 乾性</label><label><input type="radio" name="skinType" value="混合性"> 混合性</label>
                            <label><input type="radio" name="skinType" value="敏感性"> 敏感性</label><label><input type="radio" name="skinType" value="其他"> 其他</label>
                        </div>

                        <div class="flex flex-wrap items-center gap-3"><span class="font-bold">● 皮膚狀況：</span>
