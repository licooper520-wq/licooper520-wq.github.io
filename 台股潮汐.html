<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股板塊資金潮汐模仿版 (Tide Clone)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 用於繪製泡泡圖 (Bubble Chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <!-- 頂部標題 -->
    <header class="w-full max-w-4xl mb-6 text-center">
        <h1 class="text-3xl font-bold tracking-wider">🌊 台股板塊資金潮汐地圖</h1>
        <p class="text-sm text-slate-400 mt-1">盤後法人資金流向視覺化工具（模擬原型）</p>
    </header>

    <!-- 主要圖表區塊 -->
    <main class="w-full max-w-4xl bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <span class="text-sm font-semibold text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/25">
                ● 泡泡大小代表近 20 日資金規模
            </span>
            <span class="text-xs text-slate-400">更新日期：2026.08.28 (盤後)</span>
        </div>

        <!-- 泡泡圖容器 -->
        <div class="relative w-full h-[450px]">
            <canvas id="tideBubbleChart"></canvas>
        </div>
    </main>

    <!-- 說明小卡 -->
    <footer class="w-full max-w-4xl mt-6 grid grid-cols-1 md:grid-cols-4 gap-3 text-xs text-slate-400">
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
            <strong class="text-emerald-400 block mb-1">🚀 加速流入</strong> 資金持續湧入且動能增強的強勢板塊
        </div>
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
            <strong class="text-blue-400 block mb-1">📈 流入但放緩</strong> 雖然買超但力道開始減弱
        </div>
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
            <strong class="text-amber-400 block mb-1">⚠️ 流出但放緩</strong> 賣超力道減輕，可能有打底機會
        </div>
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
            <strong class="text-rose-400 block mb-1">🔻 加速流出</strong> 法人提款、資金急速撤離的弱勢板塊
        </div>
    </footer>

    <!-- JavaScript 邏輯：渲染泡泡圖 -->
    <script>
        const ctx = document.getElementById('tideBubbleChart').getContext('2d');

        // 模擬台股各板塊數據
        // x軸: 資金累積量 (流入/流出), y軸: 資金動能 (加速/減速), r: 資金規模
        const bubbleData = {
            datasets: [{
                label: '台股產業板塊',
                data: [
                    { x: 15, y: 12, r: 18, name: '半導體業' },
                    { x: 8, y: -5, r: 14, name: '電腦及週邊' },
                    { x: -10, y: -15, r: 12, name: '航運業' },
                    { x: -5, y: 8, r: 10, name: '生技醫療' },
                    { x: 12, y: 15, r: 22, name: 'AI 概念群' },
                    { x: -14, y: 4, r: 9, name: '金融保險' },
                    { x: 3, y: -2, r: 11, name: '通信網路' }
                ],
                backgroundColor: function(context) {
                    const val = context.raw;
                    if (!val) return 'rgba(56, 189, 248, 0.6)';
                    // 依據象限自動上色
                    if (val.x >= 0 && val.y >= 0) return 'rgba(52, 211, 153, 0.7)'; // 加速流入 (綠/藍)
                    if (val.x >= 0 && val.y < 0)  return 'rgba(56, 189, 248, 0.7)'; // 流入放緩
                    if (val.x < 0 && val.y >= 0)  return 'rgba(251, 191, 36, 0.7)';  // 放緩
                    return 'rgba(244, 63, 94, 0.7)'; // 加速流出 (紅)
                },
                borderColor: '#ffffff',
                borderWidth: 1
            }]
        };

        const tideBubbleChart = new Chart(ctx, {
            type: 'bubble',
            data: bubbleData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        title: { display: true, text: '← 資金流出 | 資金流入 →', color: '#94a3b8' },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#94a3b8' }
                    },
                    y: {
                        title: { display: true, text: '← 動能減緩 | 動能加速 →', color: '#94a3b8' },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: '#94a3b8' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const pt = context.raw;
                                return `${pt.name}: 資金累積 ${pt.x}, 動能 ${pt.y}`;
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
