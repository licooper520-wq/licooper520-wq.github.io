<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.57Beauty Skin - 雙系統美學管理 v3.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#FAF6f0',    
                            card: '#ffffff',
                            primary: '#B68D6A',  
                            secondary: '#D4B89F',
                            text: '#4A3B32',    
                            border: '#E8DCCB'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'PMingLiU', 'serif'],
                        sans: ['"PingFang TC"', '"Microsoft JhengHei"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        canvas { touch-action: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .input-line {
            border: none; border-bottom: 1px solid #71717a; background: transparent;
            border-radius: 0; padding: 0 4px; outline: none; color: #4A3B32;
        }
        .input-line:focus { border-bottom: 2px solid #B68D6A; }
        input[type="checkbox"], input[type="radio"] {
            accent-color: #B68D6A; width: 1.1rem; height: 1.1rem; cursor: pointer;
        }
        .sub-checkbox {
            accent-color: #B68D6A; width: 0.95rem; height: 0.95rem; cursor: pointer;
        }
        .export-hidden { display: flex; }
        body.exporting .export-hidden { display: none !important; }
        body.exporting .paper-container { box-shadow: none; border: none; border-radius: 0; margin: 0; padding: 2rem; max-width: none; }
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #B68D6A;
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #main-content { font-size: var(--app-font-size, 1rem); }
        
        #globalLoader.hidden,
        #restoreModal.hidden,
        #dbModal.hidden,
        #signatureModal.hidden {
            display: none !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-brand-text relative">

    <!-- 系統導覽列 -->
    <header class="bg-brand-text text-white shadow-md px-3 md:px-6 py-3 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand-primary rounded flex items-center justify-center font-bold text-lg text-white shadow-inner">
                J
            </div>
            <div class="hidden md:block">
                <h1 class="font-bold text-lg tracking-wider">J.57 雙系統美學管理</h1>
                <p class="text-xs text-brand-secondary" id="currentCustomerNameDisplay">正在建立新表單...</p>
            </div>
        </div>
        
        <div class="flex items-center gap-1.5 md:gap-2">
            <div class="flex items-center bg-gray-700 rounded px-1.5 py-1 text-xs md:text-sm mr-1">
                <span class="text-gray-300 mr-1 hidden sm:inline"><i class="fas fa-text-height"></i></span>
                <button type="button" onclick="window.adjustFontSize(-1)" class="px-2 py-0.5 hover:bg-gray-600 rounded font-bold transition" title="縮小字體">A-</button>
                <span id="fontSizeIndicator" class="px-1 text-brand-secondary font-medium">100%</span>
                <button type="button" onclick="window.adjustFontSize(1)" class="px-2 py-0.5 hover:bg-gray-600 rounded font-bold transition" title="放大字體">A+</button>
            </div>

            <input type="file" id="backupFileInput" class="hidden" accept=".json" onchange="window.handleFileSelect(event)">

            <button type="button" onclick="window.createNewCustomer()" class="px-3 py-2 bg-gray-600 hover:bg-gray-500 rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5" title="開新表單">
                <i class="fas fa-plus"></i> <span class="hidden sm:inline">新表單</span>
            </button>
            <button type="button" onclick="window.openCustomerListModal()" class="px-3 py-2 bg-gray-700 hover:bg-gray-600 rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 border border-gray-500" title="開啟雲端資料庫">
                <i class="fas fa-database"></i> <span class="hidden sm:inline">資料庫</span>
            </button>
            
            <div class="relative group">
                <button type="button" class="px-3 py-2 bg-brand-secondary hover:bg-brand-primary text-white rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fas fa-shield-alt"></i> <span class="hidden sm:inline">智慧備份</span> <i class="fas fa-caret-down text-xs"></i>
                </button>
                <div class="absolute right-0 mt-1 w-52 bg-white rounded-lg shadow-xl py-2 hidden group-hover:block z-30 text-gray-800 border border-gray-200">
                    <button type="button" onclick="window.exportDatabaseBackup()" class="w-full text-left px-4 py-2.5 hover:bg-brand-bg text-xs md:text-sm flex items-center gap-2">
                        <i class="fas fa-file-download text-brand-primary"></i> 匯出本機備份檔 (.json)
                    </button>
                    <button type="button" onclick="window.triggerRestoreBackup()" class="w-full text-left px-4 py-2.5 hover:bg-brand-bg text-xs md:text-sm flex items-center gap-2">
                        <i class="fas fa-file-upload text-blue-600"></i> 從檔案還原資料
                    </button>
                </div>
            </div>

            <button type="button" onclick="window.saveToDB()" class="px-3.5 py-2 bg-brand-primary hover:bg-brand-secondary text-white rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5 shadow-lg">
                <i class="fas fa-cloud-upload-alt"></i> <span class="hidden sm:inline">雲端儲存</span>
            </button>
            <button type="button" onclick="window.exportToImage()" class="px-3 py-2 bg-blue-600 hover:bg-blue-500 rounded text-xs md:text-sm font-medium transition flex items-center gap-1.5">
                <i class="fas fa-image"></i> <span class="hidden lg:inline">匯出圖片</span>
            </button>
        </div>
    </header>

    <!-- 分頁切換標籤 (四大分頁) -->
    <div class="bg-white border-b border-gray-200 flex justify-center flex-wrap gap-2 sm:gap-6 shrink-0 px-2 pt-2">
        <button type="button" onclick="window.switchTab('tab-skin-intake')" id="btn-tab-skin-intake" class="py-2.5 px-3 font-bold text-brand-primary border-b-4 border-brand-primary transition text-
